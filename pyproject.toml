[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fauna-pulse-export"
dynamic = ["version"]
description = "Turn FaunaPulse sessions into formats that other software reads (Insect Detect camera layout for insect-detect-post)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
dependencies = []

[project.scripts]
fauna-pulse-export = "fauna_pulse_export.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fauna_pulse_export.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
